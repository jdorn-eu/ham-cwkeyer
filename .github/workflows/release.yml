name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    # Do not publish a source release that no longer builds on a platform the
    # README supports.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: |
          make clean
          make
          make test

  release:
    needs: macos
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags so `git describe` names the tarball.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build and test
        run: |
          make clean
          make
          make test

      - name: Build distribution tarball
        run: make dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              ham-cwkeyer-*.tar.gz
