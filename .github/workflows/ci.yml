name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev shellcheck

      - name: Strict build
        run: make clean && make CFLAGS='-O2 -Wall -Wextra -Wpedantic -Werror'

      - name: Test
        run: make test

      - name: Lint scripts
        run: shellcheck cw-mic-mix.sh tests/test_mic_mix.sh
