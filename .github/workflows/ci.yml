name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Pin to a concrete LTS rather than ubuntu-latest (which is migrating to
    # Ubuntu 26.04) so the runner does not change underneath us.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev shellcheck

      - name: Build (strict)
        run: make clean && make

      - name: Test
        run: make test

      - name: Differential test against third-party keyers
        run: make test-differential

      - name: Static analysis
        run: make analyze

      - name: Lint scripts
        run: shellcheck cw-mic-mix.sh tests/test_mic_mix.sh

  clang:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libasound2-dev

      - name: Build and test with clang
        run: |
          make clean
          make CC=clang
          make test CC=clang
          make test-differential CC=clang

  sanitizers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          make clean
          make test CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev gcovr

      - name: Coverage
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  macos:
    # Pinned like the Linux runners so the toolchain does not move underneath
    # us. macOS ships clang as cc; the Makefile asks the compiler which warning
    # set to use, so the strict build works there unchanged.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          cc --version
          command -v shellcheck || brew install shellcheck

      - name: Build (strict)
        run: make clean && make

      - name: Test
        run: make test

      - name: Differential test against third-party keyers
        run: make test-differential

      # AddressSanitizer's leak checker is not available on Darwin and aborts
      # if asked for, so unlike the Linux job this one only asks for stack
      # traces.
      - name: Sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          make clean
          make test CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'

      - name: Lint scripts
        run: shellcheck cw-mic-mix.sh tests/test_mic_mix.sh
